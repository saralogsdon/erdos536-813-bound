name: Verify candidate bound

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact finite verifier
        run: python verify_finite.py
      - name: Independent hypergraph verifier
        run: python verify_two_layer_independent.py

  lean-90:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore compiled project modules
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}-

      - name: Generate/update Lake manifest
        run: lake update

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build T=90 certificate only
        run: lake build Erdos536813.TwoLayer90

      - name: Save T=90 checkpoint
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}-${{ github.sha }}-90

