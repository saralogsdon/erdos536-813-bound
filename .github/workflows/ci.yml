name: Verify one-slice L23 bound

on:
  push:
  workflow_dispatch:

jobs:
  axis-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Generate/update Lake manifest
        run: lake update

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build one-slice L23 bound
        run: lake build Erdos536813.AxisBound
