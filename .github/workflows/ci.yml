name: Verify candidate bound

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact finite verifier
        run: python verify_finite.py
      - name: Independent hypergraph verifier
        run: python verify_two_layer_independent.py

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean project with caches
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true
